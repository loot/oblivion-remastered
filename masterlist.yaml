globals:

groups:
  - name: &gameMasterGroup Main Game Master

  - name: &veryEarlyGroup Very Early Loaders
    description: 'A group for modules that should load early before the DLC and Unofficial patches.'
    after: [ *gameMasterGroup ]

  - name: &preDLCPatchesGroup Pre DLC Patches

  - name: &dlcGroup DLC
    after:
      - *veryEarlyGroup
      - *preDLCPatchesGroup

  - name: &postDLCPatchesGroup Post DLC Patches
    after: [ *dlcGroup ]

  - name: &underridesGroup Underrides
    after: [ *veryEarlyGroup ]

  - name: &earlyLoadersGroup Early Loaders
    description: 'A group for modules that should load early just after the DLC and Unofficial patches.'
    after: [ *postDLCPatchesGroup ]

  - name: default
    after:
      - *earlyLoadersGroup
      - *underridesGroup

  - name: &lowPriorityGroup Low Priority Overrides
    description: 'A group for modules that must load after most other mods.'
    after: [ default ]

  - name: &mediumPriorityGroup Medium Priority Overrides
    after: [ *lowPriorityGroup ]

  - name: &coreGroup Core Mods
    after: [ *mediumPriorityGroup ]

  - name: &uniquelandscapeGroup Unique Landscapes
    description: 'A group for Unique Landscape main files.'
    after: [ *coreGroup ]

  - name: &openCitiesGroup Open Cities
    description: 'A group for Open Cities.'
    after: [ *uniquelandscapeGroup ]

  - name: &betterCitiesGroup Better Cities
    description: 'A group for Better Cities Full & separate city modules.'
    after: [ *openCitiesGroup ]

  - name: &highPriorityGroup High Priority Overrides
    after: [ *betterCitiesGroup ]

  - name: &bcImperialCityGroup Better Cities Imperial City
    description: 'A group for Better Cities Imperial City, loads late due to WRLD changes.'
    after: [ *highPriorityGroup ]

  - name: &lateLoadersGroup Late Loaders
    after: [ *bcImperialCityGroup ]

  - name: &latePatchesGroup Late Patches
    after: [ *lateLoadersGroup ]

  - name: &bashFilterPatchesGroup Bash Filter Patches
    after: [ *latePatchesGroup ]

  - name: &worldSettingsGroup Worldspace Settings
    description: 'A group for modules that need to be loaded late to preserve worldspace settings.'
    after: [ *bashFilterPatchesGroup ]

  - name: &conflictResPatchGroup Conflict Resolution Patches
    description: 'A group for patches that resolve conflicts.'
    after: [ *worldSettingsGroup ]

  - name: &dynamicPatchesGroup Dynamic Patches
    description: 'A group for patches that are dynamically generated by modding tools.'
    after: [ *conflictResPatchGroup ]

  - name: &lateChangesGroup Late Fixes & Changes
    description: 'A group for modules that need to be placed after dynamic patches such as Bashed Patch.'
    after: [ *dynamicPatchesGroup ]

  - name: &lodTogglerGroup LOD Toggler
    description: 'A group for modules that add or alter LOD.'
    after: [ *lateChangesGroup ]

